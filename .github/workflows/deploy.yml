name: Build

# только сборка образа в ghcr; на сервер CI не заходит.
# обновление на сервере вручную: docker compose pull && docker compose up -d (см. deploy/vpn/README.md)
on:
  push:
    branches:
      - production

env:
  IMAGE_NAME: ghcr.io/fllunn/document-fill-backend

jobs:
  build-and-push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
